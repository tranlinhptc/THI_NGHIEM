                $(document).ready(function () {

                function handleCmdComplete(xhr, status, args) {
                    if (args.Method)
                    {
                        switch (args.Method)
                        {
                            case 'eLoadAttrConfig':
                                intAttrSub(JSON.parse(Base64.decode(args.attrCtrlConfig)),
                                        JSON.parse(Base64.decode(args.attrDataInit)),
                                        JSON.parse(Base64.decode(args.attrDataHis)),
                                        JSON.parse(Base64.decode(args.attrDataLast)),

                                        JSON.parse(Base64.decode(args.attrAlertConfig)),
                                        JSON.parse(Base64.decode(args.attrCtrlFuncConfig)),
                                        Base64.decode(args.htmlTemplate));
                                if (args.mode === 'edit')
                                {
                                    intAttrSubAddEdit(JSON.parse(Base64.decode(args.attrData)));
                                    initDataWork(JSON.parse(Base64.decode(args.attrDataWork)));
                                }
                                break;
                            case 'eUpdateAttrData':
                                updateAttrDataHis(JSON.parse(Base64.decode(args.attrDataLast)),

                                        JSON.parse(Base64.decode(args.attrDataPro)));
                                break;

                    scope.initDataPro(attrDataPro);
                    scope.$digest();
                }
                ;
                function intAttrSub(attrCtrlConfig, attrDataInit, attrDataHis, attrDataLast, attrDataStart, attrDataPro,attrDataWork, attrAlertConfig, attrCtrlFuncConfig, htmlTemplate) {
                    var scope = angular.element(document.getElementById('attrController')).scope();
                    scope.initCtrlConfig(attrCtrlConfig);
                    scope.initData({});
                    scope.initDataInit(attrDataInit);
                    scope.initDataHis(attrDataHis);
                    scope.initDataLast(attrDataLast);
                    scope.initDataStart(attrDataStart);
                    scope.initDataPro(attrDataPro);
                    scope.initDataWork(attrDataWork);
                    scope.initAlertConfig(attrAlertConfig);
                    scope.initTemplate(htmlTemplate);
                    var functionContent;
                    var functionName;
                    for (var i = 0; i < attrCtrlFuncConfig.length; i++) {
                        try {
                            functionContent = Base64.decode(attrCtrlFuncConfig[i].FUNCTION_CONTENT);
                            functionName = attrCtrlFuncConfig[i].FUNCTION_NAME;
                            if (functionContent) {
                                eval("scope." + functionName + " = " + functionContent);
                            }
                        } catch (error) {

                        }
                    }
                    scope.$digest();
                }
                ;
